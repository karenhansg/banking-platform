spring:
  application:
    name: banking-api
  profiles:
    # Without an explicit profile the app targets the local docker compose environment (application-local.yml).
    default: local
  datasource:
    hikari:
      maximum-pool-size: 10
      data-source-properties:
        # Fail fast instead of queueing behind a long-held row lock or a runaway query.
        options: "-c lock_timeout=5s -c statement_timeout=30s"
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entity mappings match it.
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # Amazon Cognito in AWS (set by the ECS task definition); the mock OAuth2 server in docker compose locally.
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8090/banking}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8090/banking/jwks}

server:
  port: 8080
  # Honour X-Forwarded-* headers from the load balancer (trusted from private address ranges only).
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

banking:
  # Set per environment by the ECS task definition.
  business-time-zone: ${BANKING_BUSINESS_TIME_ZONE:UTC}
  daily-withdrawal-limit: ${BANKING_DAILY_WITHDRAWAL_LIMIT:1000.00}
  payments:
    acceptance-window: ${BANKING_PAYMENT_ACCEPTANCE_WINDOW:P3D}
    scheduler-enabled: true
    scheduler-interval: PT15S
    scheduler-batch-size: 100

logging:
  level:
    software.amazon.jdbc: WARN
