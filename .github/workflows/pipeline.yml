# Continuous integration and delivery.
#
#   pull request:  build and test ─┬─ validate infrastructure
#                                  └─ build and scan image
#   push to main:  ... ─ publish image ─ deploy dev ─ deploy prod (after approval)
#
# The same image, identified by the commit SHA, is promoted from dev to prod. Third-party actions are pinned to
# commit SHAs.

name: pipeline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: banking-api

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Unit tests, integration tests (Testcontainers) and coverage gate
        run: ./mvnw -B verify

      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
          retention-days: 14

  infrastructure:
    name: Validate infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff infra

      - name: Validate
        run: |
          for root in infra/bootstrap infra/environments/dev infra/environments/prod; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.64.0

      - name: Lint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when tflint downloads its AWS ruleset
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/infra/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/infra/.tflint.hcl" --chdir infra

      - name: Security scan
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: infra
          config_file: infra/.checkov.yaml

      - name: Lint deployment scripts
        run: shellcheck scripts/*.sh

  image:
    name: Build, scan and publish image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC federation to AWS; no stored AWS keys
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Tasks run on Graviton (ARM64). The Maven stage runs natively, so no emulation is needed.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Configure AWS credentials
        if: env.PUBLISH == 'true'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_PUBLISHER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: env.PUBLISH == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Pushes exactly the image that was scanned.
      - name: Publish image
        id: publish
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
        run: |
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$IMAGE"
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: Deploy dev
    needs: [image, infrastructure]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      image: ${{ needs.image.outputs.image }}
    secrets: inherit

  # The prod GitHub environment requires a reviewer's approval before this job starts.
  deploy-prod:
    name: Deploy prod
    needs: [image, deploy-dev]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      image: ${{ needs.image.outputs.image }}
    secrets: inherit
