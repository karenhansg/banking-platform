# Weekly update pull requests for every dependency ecosystem in the repository; each still has to pass the pipeline.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
      - /infra/environments/dev
      - /infra/environments/prod
    schedule:
      interval: weekly
